<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img" aria-labelledby="title desc">
<title id="title">Countersign system architecture</title><desc id="desc">Agent API and human reviewer UI share the web Worker. D1 stores revisions and approvals. Queues trigger a separate sending Worker, which calls Resend. Signed delivery events return to the web Worker.</desc>
